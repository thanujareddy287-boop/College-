<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Student Management System</h1>
        <p>Java MVC • JDBC • MySQL • Node.js</p>
    </div>
</header>

<main class="container">
    <section class="card">
        <div class="section-heading">
            <div>
                <h2 id="formTitle">Add Student</h2>
                <p>Enter student details below.</p>
            </div>
        </div>

        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" required maxlength="100" placeholder="Enter name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" required maxlength="150" placeholder="Enter email">
                </div>

                <div class="field">
                    <label for="course">Course</label>
                    <input id="course" required maxlength="100" placeholder="e.g. Computer Science">
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input id="age" type="number" min="1" max="100" required placeholder="Age">
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" maxlength="20" placeholder="Phone number">
                </div>
            </div>

            <div class="actions">
                <button class="primary" type="submit" id="saveButton">Add Student</button>
                <button class="secondary" type="button" id="cancelButton" hidden>Cancel Edit</button>
            </div>
        </form>
    </section>

    <section class="card">
        <div class="section-heading list-heading">
            <div>
                <h2>Students</h2>
                <p id="countText">Loading...</p>
            </div>
            <input id="searchInput" class="search" placeholder="Search by name, email or course">
        </div>

        <div id="message" class="message" hidden></div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
